<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: bloom-new.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=REM:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0c1a13}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-masthead region chrome" data-region="masthead"><!-- 72px dark navigation with original Bloom wordmark and two links --></div>
  <figure class="r-hero-photo region plate" data-region="hero-photo"><img src="../../mocks/hero-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-hero-title region text" data-region="hero-title"><!-- Знайте, что выбираете. Two lines, white sans, approximately 112px --><p style="font-size:var(--r-hero-title-font);font-family:var(--r-hero-title-family),sans-serif;font-weight:var(--r-hero-title-weight);line-height:1.05;margin:0">hero-title</p></div>
  <div class="r-hero-description region text" data-region="hero-description"><!-- Понятные факты о продуктах. --><p style="font-size:var(--r-hero-description-font);line-height:1.05;margin:0">hero-description</p></div>
  <div class="r-hero-caption region text" data-region="hero-caption"><!-- Концепция приложения --><p style="line-height:1.05;margin:0">hero-caption</p></div>
  <div class="r-store-buttons region control" data-region="store-buttons"><!-- App Store and Google Play placeholders: rebuild the control's chrome from the crop (comp-spec.mjs --crop store-buttons); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-intro-title region text" data-region="intro-title"><!-- Состав. Оценка. Основание. --><p style="font-size:var(--r-intro-title-font);line-height:1.05;margin:0">intro-title</p></div>
  <div class="r-intro-caption region text" data-region="intro-caption"><!-- За каждым выводом — источник. --><p style="font-size:var(--r-intro-caption-font);line-height:1.05;margin:0">intro-caption</p></div>
</main>
</body>
</html>
